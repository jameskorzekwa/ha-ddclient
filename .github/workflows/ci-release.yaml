name: CI and release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci-release.yaml"
      - "ddclient/**"
      - "repository.yaml"
      - "!**/AGENTS.md"
      - "!**/*.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci-release.yaml"
      - "ddclient/**"
      - "repository.yaml"
      - "!**/AGENTS.md"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint add-on
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.7

      - name: Run Home Assistant add-on lint
        uses: frenck/action-addon-linter@v2.15
        with:
          path: ./ddclient

      - name: Run ShellCheck
        run: >-
          shellcheck -e SC1008 -s bash
          ddclient/rootfs/etc/s6-overlay/s6-rc.d/ha-ddclient/run
          ddclient/rootfs/etc/s6-overlay/s6-rc.d/ha-ddclient/finish

  test-build:
    name: Test build ${{ matrix.arch }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - amd64
          - armhf
          - armv7
          - i386
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.7

      - name: Get add-on information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./ddclient

      - name: Get image name
        id: image
        env:
          RAW_IMAGE: ${{ steps.info.outputs.image }}
        run: |
          image="${RAW_IMAGE//\"/}"
          echo "image=${image##*/}" >> "$GITHUB_OUTPUT"

      - name: Test build add-on
        uses: home-assistant/builder@2024.03.5
        with:
          args: |
            --test \
            --${{ matrix.arch }} \
            --target /data/ddclient \
            --image "${{ steps.image.outputs.image }}" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}" \
            --addon

  prepare-release:
    name: Bump release version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - lint
      - test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"

          if [[ "$remote_sha" != "$TESTED_SHA" ]]; then
            parent_sha="$(git rev-parse "${remote_sha}^" 2>/dev/null || true)"
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$remote_sha")"
            release_subject="$(git log -1 --format=%s "$remote_sha")"
            if [[ "$parent_sha" != "$TESTED_SHA" || "$changed_files" != "ddclient/config.yaml" || ! "$release_subject" =~ ^Release\ [0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "A newer main revision exists; its workflow will release it."
              exit 0
            fi

            git checkout "$remote_sha"
            version="$(awk -F '"' '/^version: / { print $2; exit }' ddclient/config.yaml)"
            if [[ "$release_subject" != "Release $version" ]]; then
              echo "Unexpected release version in $remote_sha." >&2
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
              echo "Version $version is already released."
              exit 0
            fi
            echo "Retrying incomplete release $version."
          else
            current_version="$(awk -F '"' '/^version: / { print $2; exit }' ddclient/config.yaml)"
            IFS=. read -r major minor patch <<< "$current_version"
            if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ || ! "$patch" =~ ^[0-9]+$ ]]; then
              echo "Invalid add-on version: $current_version" >&2
              exit 1
            fi

            version="$major.$minor.$((patch + 1))"
            if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
              echo "Tag $version already exists." >&2
              exit 1
            fi

            sed -i "s/^version: .*/version: \"$version\"/" ddclient/config.yaml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ddclient/config.yaml
            git commit -m "Release $version"
            git push origin HEAD:main
            remote_sha="$(git rev-parse HEAD)"
          fi

          echo "sha=$remote_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.arch }} image
    if: needs.prepare-release.outputs.version != ''
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - amd64
          - armhf
          - armv7
          - i386
    steps:
      - name: Check out release revision
        uses: actions/checkout@v4.1.7
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Get add-on information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./ddclient

      - name: Get image name
        id: image
        env:
          RAW_IMAGE: ${{ steps.info.outputs.image }}
        run: |
          image="${RAW_IMAGE//\"/}"
          echo "image=${image##*/}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish add-on
        uses: home-assistant/builder@2024.03.5
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/ddclient \
            --image "${{ steps.image.outputs.image }}" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}" \
            --addon

  release:
    name: Create GitHub release
    if: needs.prepare-release.outputs.version != ''
    needs:
      - prepare-release
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: >-
          gh release create "$VERSION"
          --repo "$GITHUB_REPOSITORY"
          --target "$RELEASE_SHA"
          --title "$VERSION"
          --generate-notes
